name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint --if-present
      - name: Run unit tests
        run: npm test -- --passWithNoTests
      - name: Contract snapshot (OpenAPI present)
        run: test -f public/swagger/openapi.json
